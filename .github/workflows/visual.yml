# UI Revamp visual fidelity.
#
# Required jobs:
#   plan             - reads .github/ci-shards.json and builds the shard matrix.
#   static           - lint, types, unit tests, production build and the static
#                      guards.
#   build            - one visual build, shared by every shard as an artifact.
#   visual (shard)   - independent shards of the visual suite.
#   quality          - the aggregate gate. This is the required status check.
#
# Every job above is required through `quality`; there is no continue-on-error
# path left in this workflow.

name: visual

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  plan:
    name: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      shards: ${{ steps.matrix.outputs.shards }}
    steps:
      - uses: actions/checkout@v6.1.0
      - id: matrix
        run: |
          node - <<'NODE'
          const { readFileSync, appendFileSync } = require('node:fs');
          const config = JSON.parse(readFileSync('.github/ci-shards.json', 'utf8'));
          const shards = config.shards.map(({ name, args, extra }) => ({ name, args, extra }));
          appendFileSync(process.env.GITHUB_OUTPUT, `shards=${JSON.stringify(shards)}\n`);
          NODE

  static:
    name: static
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6.1.0
      - uses: actions/setup-node@v6.5.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: npm run test
      # The production build must not carry the ?fixture= seeder or the
      # prototypes' demo data.
      - run: npm run build && npm run check:no-fixtures
      # The ported global CSS must still be the prototypes' CSS, rule for rule.
      - run: npm run check:ui-css
      # The five prototypes keep their own token blocks and shell rules.
      - run: npm run check:prototype-shared
      # WCAG report for the token pairs the pages use. Failing pairs print for
      # the review but do not gate the build: the tokens come from the
      # prototypes and are never changed by an agent.
      - run: npm run check:contrast
      # Every visual test must be in a shard unless it is explicitly
      # informational. The shards run in the visual job below.
      - run: npm run check:ci-coverage

  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6.1.0
      - uses: actions/setup-node@v6.5.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:visual
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: dist-visual
          path: dist-visual
          retention-days: 1

  visual:
    name: visual (${{ matrix.shard.name }})
    needs: [plan, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v6.1.0
      - uses: actions/setup-node@v6.5.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - id: playwright-version
        run: echo "version=$(node -p "require('./package.json').devDependencies['@playwright/test']")" >> "$GITHUB_OUTPUT"
      - id: playwright-cache
        uses: actions/cache@v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium
      - name: Install Chromium system dependencies
        run: npx playwright install-deps chromium
      - uses: actions/download-artifact@v8.0.2
        with:
          name: dist-visual
          path: dist-visual
      - name: Run shard
        env:
          PW_SKIP_BUILD: '1'
        run: |
          ${{ matrix.shard.extra }}
          npx playwright test ${{ matrix.shard.args }}
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: visual-${{ matrix.shard.name }}-failure
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore
      - name: Upload results
        if: success()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: visual-${{ matrix.shard.name }}-results
          path: test-results/results.json
          retention-days: 3
          if-no-files-found: ignore

  quality:
    name: quality
    if: always()
    needs: [plan, static, build, visual]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify every required job succeeded
        env:
          PLAN: ${{ needs.plan.result }}
          STATIC: ${{ needs.static.result }}
          BUILD: ${{ needs.build.result }}
          VISUAL: ${{ needs.visual.result }}
        run: |
          failed=0
          for entry in "plan=$PLAN" "static=$STATIC" "build=$BUILD" "visual=$VISUAL"; do
            name=${entry%%=*}
            result=${entry#*=}
            echo "$name: $result"
            if [ "$result" != "success" ]; then
              echo "::error::$name did not succeed ($result)"
              failed=1
            fi
          done
          exit "$failed"
