# UI Revamp visual fidelity (UI Revamp Issue 0).
#
# Two jobs:
#   quality          - required. Everything that must be green before a PR lands.
#   visual-fidelity  - informational for now. The app has not been ported to the
#                      prototypes yet, so the page diffs and health tests are
#                      expected to fail. They are wired up and running so that
#                      each page's report is already on record.
#
# This job becomes REQUIRED in Issue 7, when every page is expected to pass.

name: visual

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: quality
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6.1.0
      - uses: actions/setup-node@v6.5.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: npm run test
      # The production build must not carry the ?fixture= seeder or the
      # prototypes' demo data.
      - run: npm run build && npm run check:no-fixtures
      - run: npx playwright install --with-deps chromium
      # The ported global CSS must still be the prototypes' CSS, rule for rule.
      # A pixel diff cannot catch a changed --ease or a dropped bracket arm: by
      # the time anything is captured every animation has finished, so the
      # screenshot is identical and the rule is silently wrong.
      - run: npm run check:ui-css
      # The five prototypes are edited one file at a time and each keeps its own
      # copy of the token blocks and the shell rules. check:ui-css compares the
      # app against today.html alone, so drift between the other four would be
      # invisible to it.
      - run: npm run check:prototype-shared
      # Proves the harness itself is deterministic: the same page rendered twice
      # must produce the same pixels. A failure here invalidates every diff the
      # other job reports.
      - run: npx playwright test selftest
      # The app shell is ported, so the header region is now a hard guarantee:
      # 5 pages x 2 viewports x 2 themes, dimensions and pixels and computed
      # styles all against the prototype.
      - run: npx playwright test shell
      # The Today page is ported too (Issue 2): 2 viewports x 2 themes of the
      # full-page pixel and computed-style diff, its health check, and the three
      # interaction scenarios x 2 themes. The grep keeps the other four pages out
      # of this required job; they are still reported by visual-fidelity below.
      - run: npx playwright test fidelity --grep today
      - run: npx playwright test health --grep today
      - run: npx playwright test today-interactions

  visual-fidelity:
    name: visual-fidelity (informational)
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6.1.0
      - uses: actions/setup-node@v6.5.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Expected to fail until each page is ported. Excludes selftest and
      # shell, which the required job already gates.
      - run: npx playwright test fidelity health
      - name: Upload visual artifacts
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: visual-results-${{ github.run_number }}
          path: |
            test-results/
            playwright-report/
          retention-days: 14
          if-no-files-found: ignore
