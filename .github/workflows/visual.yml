# UI Revamp visual fidelity (UI Revamp Issue 0).
#
# Two jobs:
#   quality          - required. Everything that must be green before a PR lands.
#   visual-fidelity  - informational for now. The app has not been ported to the
#                      prototypes yet, so the page diffs and health tests are
#                      expected to fail. They are wired up and running so that
#                      each page's report is already on record.
#
# This job becomes REQUIRED in Issue 7, when every page is expected to pass.

name: visual

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: quality
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6.1.0
      - uses: actions/setup-node@v6.5.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: npm run test
      # The production build must not carry the ?fixture= seeder or the
      # prototypes' demo data.
      - run: npm run build && npm run check:no-fixtures
      - run: npx playwright install --with-deps chromium
      # Proves the harness itself is deterministic: the same page rendered twice
      # must produce the same pixels. A failure here invalidates every diff the
      # other job reports.
      - run: npx playwright test selftest

  visual-fidelity:
    name: visual-fidelity (informational)
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6.1.0
      - uses: actions/setup-node@v6.5.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Expected to fail until each page is ported. Excludes selftest, which the
      # required job already gates.
      - run: npx playwright test fidelity health
      - name: Upload visual artifacts
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: visual-results-${{ github.run_number }}
          path: |
            test-results/
            playwright-report/
          retention-days: 14
          if-no-files-found: ignore
